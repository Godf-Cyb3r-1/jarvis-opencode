name: Jarvis foundation tests
on:
  push:
    branches: [main]
    paths: ['jarvis/**', 'VERSION', '.github/workflows/jarvis-unit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test jarvis/test
