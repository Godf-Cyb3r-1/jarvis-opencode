name: Jarvis parallel conversation and human speech checks
on:
  workflow_dispatch:
  push:
    branches: [feature/jarvis-always-available-conversation]
    paths:
      - 'jarvis/**'
      - 'packages/app/src/session/**'
      - 'packages/core/src/tool/plugin/question.ts'
      - '.github/workflows/jarvis-parallel-conversation.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Controller and independent conversation tests
        run: cd packages/core && bun test src/jarvis/
      - name: App typecheck
        run: bun run --cwd packages/app typecheck
      - name: Core typecheck
        run: bun run --cwd packages/core typecheck
