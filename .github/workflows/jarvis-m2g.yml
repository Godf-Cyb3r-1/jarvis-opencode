name: Jarvis M2G anti-bot calibration
on:
  push:
    branches: ['fix/jarvis-anti-bot-calibration']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-antibot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Jarvis core regression tests
        run: cd packages/core && bun test src/jarvis/
      - name: TUI conversation tests
        run: cd packages/tui && bun test src/feature-plugins/prompt/jarvis-expression.test.ts src/feature-plugins/prompt/jarvis-side-history.test.ts
      - name: Typecheck
        run: |
          bun run --cwd packages/core typecheck
          bun run --cwd packages/tui typecheck
      - name: Build Linux executable
        env:
          OPENCODE_VERSION: '2.2.5'
          OPENCODE_CHANNEL: latest
          OPENCODE_TARGET: linux-x64
        run: bun run --cwd packages/cli script/build.ts --single --skip-web-ui
      - name: Verify and archive
        shell: bash
        run: |
          set -euo pipefail
          binary=$(find packages/cli/dist -type f -path '*/bin/opencode' | head -1)
          test -n "$binary"
          mkdir -p artifact
          cp "$binary" artifact/jarvis-opencode-linux-x64
          chmod +x artifact/jarvis-opencode-linux-x64
          test "$(artifact/jarvis-opencode-linux-x64 --version)" = 'opencode v2.2.5'
          timeout 90 artifact/jarvis-opencode-linux-x64 debug agents --standalone > /tmp/agents.json
          jq -e 'any(.id == "jarvis" and .mode == "primary")' /tmp/agents.json
          (cd artifact && sha256sum jarvis-opencode-linux-x64 > SHA256SUMS)
          printf 'Jarvis 0.2.0-dev.7: Indian conversational anti-bot prompt, code-safe punctuation normalization; voice generation not included.\n' > artifact/BUILD_STATUS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-m2g-linux-x64
          path: artifact/
          if-no-files-found: error
