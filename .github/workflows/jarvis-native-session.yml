name: Jarvis native session milestone
on:
  push:
    branches: ['jarvis/native-session-milestone']
    paths:
      - 'packages/core/src/jarvis/**'
      - '.github/workflows/jarvis-native-session.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Run Jarvis controller and native adapter tests
        run: cd packages/core && bun test src/jarvis/
      - name: Typecheck OpenCode core with native Jarvis adapter
        run: bun run --cwd packages/core typecheck
