name: Jarvis OpenCode Linux milestone build
on:
  push:
    branches: [main]
    paths:
      - 'packages/core/src/jarvis/**'
      - 'packages/core/src/agent.ts'
      - 'jarvis/**'
      - '.github/workflows/linux-baseline.yml'
  workflow_dispatch:
concurrency:
  group: jarvis-main-linux-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile
      - name: Verify Jarvis controller and model resolver unit tests
        run: cd packages/core && bun test src/jarvis/
      - name: Typecheck native OpenCode core
        run: bun run --cwd packages/core typecheck
      - name: Build modified OpenCode Linux executable with Jarvis
        env:
          OPENCODE_VERSION: '2.2.5'
          OPENCODE_CHANNEL: latest
          OPENCODE_TARGET: linux-x64
        run: bun run --cwd packages/cli script/build.ts --single --skip-web-ui
      - name: Verify actual executable version
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(find packages/cli/dist -type f -path '*/bin/opencode' | head -1)
          test -n "$candidate"
          mkdir -p artifact
          cp "$candidate" artifact/jarvis-opencode-linux-x64
          chmod +x artifact/jarvis-opencode-linux-x64
          reported=$(artifact/jarvis-opencode-linux-x64 --version)
          echo "$reported"
          test "$reported" = "opencode v2.2.5"
          (cd artifact && sha256sum jarvis-opencode-linux-x64 > SHA256SUMS)
          printf "Jarvis 0.1.0-dev.4 | OpenCode v2.2.5\nNative primary brain agent and persona; autonomous delegation tools NOT yet installed.\n" > artifact/BUILD_STATUS.txt
      - name: Verify compiled native Jarvis agent registration
        shell: bash
        run: |
          timeout 90 artifact/jarvis-opencode-linux-x64 debug agents --standalone > /tmp/agents.json
          jq -e 'any(.id == "jarvis" and .mode == "primary")' /tmp/agents.json
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-m1b-linux-x64
          path: artifact/
          if-no-files-found: error
