name: One-time repository reset
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reset-repository.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Delete previous integration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/integration/opencode-source" || {
            echo "Failed to delete old integration branch"
            exit 1
          }
      - name: Empty main working tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch -- .
          if test -n "$(git ls-files)"; then
            echo "Tracked files remain; refusing to mark reset as complete"
            exit 1
          fi
          git commit -m "chore: clear repository for completely new implementation"
          git push origin HEAD:main
