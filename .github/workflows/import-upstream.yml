name: Import upstream source into Jarvis integration branch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-upstream.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout upstream OpenCode
        uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: dev
          path: _opencode_upstream
          persist-credentials: false
      - name: Stage source on integration branch
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha=$(git -C _opencode_upstream rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B integration/opencode-source
          # Keep existing Jarvis modules and CI; import the actual upstream workspace.
          for path in packages script patches; do
            if test -e "_opencode_upstream/$path"; then
              mkdir -p "$path"
              rsync -a --delete --exclude node_modules "_opencode_upstream/$path/" "$path/"
            fi
          done
          for path in package.json bun.lock bunfig.toml tsconfig.json turbo.json; do
            if test -f "_opencode_upstream/$path"; then cp "_opencode_upstream/$path" "$path"; fi
          done
          if test -f _opencode_upstream/LICENSE; then cp _opencode_upstream/LICENSE LICENSE; fi
          printf '%s\n' "$upstream_sha" > OPENCODE_UPSTREAM_SHA
          rm -rf _opencode_upstream
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: import OpenCode upstream source at $upstream_sha"
          fi
          git push origin HEAD:refs/heads/integration/opencode-source --force-with-lease
      - name: Report
        run: |
          echo "Imported on integration/opencode-source; does not mean Jarvis features are integrated." >> "$GITHUB_STEP_SUMMARY"
