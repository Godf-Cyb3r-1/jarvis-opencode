name: Jarvis three-target builds (Linux EXE Android)
on:
  workflow_dispatch:
  push:
    branches: [feature/jarvis-cloud-memory-crossplatform-instabox]
    paths:
      - 'packages/**'
      - 'android-jarvis/**'
      - 'jarvis/**'
      - '.github/workflows/jarvis-three-targets.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: cd packages/core && bun test src/jarvis/
      - run: bun run --cwd packages/core typecheck
      - name: Build Linux standalone
        env:
          OPENCODE_VERSION: '2.2.5'
          OPENCODE_CHANNEL: latest
          OPENCODE_TARGET: linux-x64
        run: bun run --cwd packages/cli script/build.ts --single --skip-web-ui
      - name: Package Linux binary
        run: |
          set -euo pipefail
          mkdir -p artifact
          executable=$(find packages/cli/dist -type f -path '*/bin/opencode' | head -1)
          test -n "$executable"
          cp "$executable" artifact/jarvis-opencode-linux-x64
          chmod +x artifact/jarvis-opencode-linux-x64
          artifact/jarvis-opencode-linux-x64 --version
          cp jarvis/run-mode.sh artifact/run-mode.sh
          (cd artifact && sha256sum jarvis-opencode-linux-x64 > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-linux-x64
          path: artifact/
          if-no-files-found: error
  windows-exe:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Build Windows standalone EXE
        env:
          OPENCODE_VERSION: '2.2.5'
          OPENCODE_CHANNEL: latest
          OPENCODE_TARGET: win32-x64
        run: bun run --cwd packages/cli script/build.ts --single --skip-web-ui
      - name: Package Windows EXE
        run: |
          mkdir -p artifact
          executable=$(find packages/cli/dist -type f -name 'opencode.exe' | head -1)
          test -n "$executable"
          cp "$executable" artifact/jarvis-opencode-windows-x64.exe
          cp jarvis/run-mode.ps1 artifact/run-mode.ps1
          ./artifact/jarvis-opencode-windows-x64.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-x64-exe
          path: artifact/
          if-no-files-found: error
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android debug APK
        run: gradle -p android-jarvis :app:assembleDebug --no-daemon --stacktrace
      - name: Package Android APK
        run: |
          mkdir -p artifact
          cp android-jarvis/app/build/outputs/apk/debug/app-debug.apk artifact/jarvis-android-debug.apk
          sha256sum artifact/jarvis-android-debug.apk > artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: artifact/
          if-no-files-found: error
