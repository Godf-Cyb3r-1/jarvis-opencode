name: Jarvis M2B worker-state reliability
on:
  push:
    branches: ['fix/jarvis-m2b-reliability']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-m2b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Jarvis regression tests
        run: cd packages/core && bun test src/jarvis/
      - name: Typecheck entire OpenCode core
        run: bun run --cwd packages/core typecheck
      - name: Build Linux binary
        env:
          OPENCODE_VERSION: '2.2.5'
          OPENCODE_CHANNEL: latest
          OPENCODE_TARGET: linux-x64
        run: bun run --cwd packages/cli script/build.ts --single --skip-web-ui
      - name: Verify binary and native Jarvis agent
        shell: bash
        run: |
          set -euo pipefail
          file=$(find packages/cli/dist -type f -path '*/bin/opencode' | head -1)
          test -n "$file"
          mkdir -p artifact
          cp "$file" artifact/jarvis-opencode-linux-x64
          chmod +x artifact/jarvis-opencode-linux-x64
          test "$(artifact/jarvis-opencode-linux-x64 --version)" = 'opencode v2.2.5'
          timeout 90 artifact/jarvis-opencode-linux-x64 debug agents --standalone > /tmp/agents.json
          jq -e 'any(.id == "jarvis" and .mode == "primary")' /tmp/agents.json
          (cd artifact && sha256sum jarvis-opencode-linux-x64 > SHA256SUMS)
          printf 'Jarvis 0.2.0-dev.2 | M2B status and execution outcome reliability. Live provider-backed testing still required.\n' > artifact/BUILD_STATUS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-m2b-linux-x64
          path: artifact/
          if-no-files-found: error
